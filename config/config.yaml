data:
  raw_path: "data/data.csv"
  raw_num_cols:
    - Account_Age_Days
    - Transaction_Volume_USD
    - Avg_Time_Between_Trans_Min
    - Flags_Last_6M
    - Avg_End_Day_Balance

split:
  test_size: 0.3
  val_size_of_temp: 0.5
  random_state: 42

model:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  primary_max_features: 0.5
  dominant_features:
    - Account_Age_Days
    - Avg_Time_Between_Trans_Min
    - Trans_Per_Hour
    - Daily_Volume
    - log_Daily_Volume

artifacts:
  dir: "artifacts"
  filename_prefix: "aml_mule_pipeline"
  reference_sample_size: 5000

monitoring:
  psi_warning_threshold: 0.1
  psi_critical_threshold: 0.2
